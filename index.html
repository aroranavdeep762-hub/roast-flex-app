<script>
        // Telegram WebApp Initialization
        const tg = window.Telegram?.WebApp;
        let userData = { name: "Player", username: "player_1", id: 12345 };
        
        const BOT_USERNAME = "roast_flex_bot"; 

        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                userData = {
                    name: u.first_name + (u.last_name ? " " + u.last_name : ""),
                    username: u.username || "telegram_user",
                    id: u.id
                };
            }
        }

        // Load or Initialize User Coins using localStorage
        let userCoins = localStorage.getItem('roast_coins_' + userData.id);
        if (userCoins === null) {
            userCoins = 300; 
            const startParam = tg?.initDataUnsafe?.start_param;
            if (startParam) {
                userCoins += 500; 
            }
            localStorage.setItem('roast_coins_' + userData.id, userCoins);
        } else {
            userCoins = parseInt(userCoins);
        }

        function saveCoins(newAmount) {
            userCoins = newAmount;
            localStorage.setItem('roast_coins_' + userData.id, userCoins);
            document.getElementById('coin-balance').innerText = userCoins;
        }

        document.getElementById('user-name').innerText = userData.name;
        document.getElementById('user-handle').innerText = '@' + userData.username;
        document.getElementById('user-avatar').innerText = userData.name.charAt(0).toUpperCase();
        document.getElementById('coin-balance').innerText = userCoins;

        // Content Bank
        const roasts = [
            `@${userData.username}, your screen time is higher than your monthly bank savings!`,
            `AI Analysis: 99% chance you ghost people after asking 'Kahan ho?'.`,
            `Your playlist consists of sad songs you've never actually related to in real life.`,
            `You spend more time organizing your phone apps than actually working on your goals.`,
            `Even your phone's battery drains faster than your motivation levels on a Monday morning.`,
            `@${userData.username}, you type 'On my way' while still lying in your bed scrolling reels.`
        ];

        const flexes = [
            `👑 ELITE STATUS: @${userData.username} operates in the top 1% alpha network. Unstoppable aura.`,
            `🚀 LEGENDARY: High-value mindset detected. Your future is printing wealth automatically.`,
            `🔥 ALPHA VIBE: Certified mastermind. People secretly copy your moves when you aren't looking.`,
            `💎 BOSS LEVEL: Unmatched focus, absolute execution power. Greatness is incoming!`
        ];

        let currentGeneratedText = "";

        function generateContent(type) {
            if (userCoins < 10) {
                alert("Not enough coins! Watch an ad or invite friends to get more coins.");
                return;
            }

            saveCoins(userCoins - 10);

            const list = type === 'roast' ? roasts : flexes;
            currentGeneratedText = list[Math.floor(Math.random() * list.length)];
            
            const outputBox = document.getElementById('result-text');
            outputBox.innerText = `"${currentGeneratedText}"`;
            
            document.getElementById('share-content-container').classList.remove('hidden');

            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function shareGeneratedResult() {
            if (!currentGeneratedText) return;
            const textToShare = `Look what AI said about me! 😂\n\n"${currentGeneratedText}"\n\nTry it on yourself here:`;
            const shareUrl = `https://t.me/share/url?url=https://t.me/${BOT_USERNAME}?start=ref_${userData.id}&text=${encodeURIComponent(textToShare)}`;
            
            if (tg?.openTelegramLink) {
                tg.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }
        }

        function shareInviteLink() {
            const shareText = "Get brutally roasted or flex your status instantly! Join now🔥";
            const shareUrl = `https://t.me/share/url?url=https://t.me/${BOT_USERNAME}?start=ref_${userData.id}&text=${encodeURIComponent(shareText)}`;
            
            if (tg?.openTelegramLink) {
                tg.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }
        }

        // AdsGram Rewarded Ad Handler (Yahan apni nayi Reward Block ID dalein agar change ki hai)
        function watchAdsGramAd() {
            if (typeof window.AdsGram !== 'undefined') {
                triggerRewardAd();
            } else {
                const script = document.createElement('script');
                script.src = "https://sad.adsgram.ai/js/sad.min.js";
                script.onload = () => {
                    triggerRewardAd();
                };
                script.onerror = () => {
                    alert("Failed to connect to AdsGram network.");
                };
                document.head.appendChild(script);
            }
        }

        function triggerRewardAd() {
            try {
                // Note: Reward blocks use numeric blockId without 'int-' prefix
                const adController = window.AdsGram.init({ blockId: "58179" });
                adController.show()
                    .then((result) => {
                        saveCoins(userCoins + 200);
                        alert("Reward Unlocked! +200 Coins added to your account.");
                        if (tg?.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                    })
                    .catch((err) => {
                        console.warn("Ad skipped or failed:", err);
                        alert("Ad was closed or failed to load. No reward granted.");
                    });
            } catch (e) {
                console.error("AdsGram trigger error:", e);
                alert("AdsGram initialization error. Please try again.");
            }
        }
    </script>v
